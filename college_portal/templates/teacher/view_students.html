<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#1d2671,#c33764);
            min-height:100vh;
        }
        .card{
            border-radius:16px;
        }
        table thead{
            background:#212529;
            color:white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">👨‍🎓 Students List</span>
    <a href="/teacher/dashboard/" class="btn btn-outline-light btn-sm">⬅ Back</a>
</nav>

<div class="container mt-5">
    <div class="card p-4">

        <h4 class="text-center fw-bold mb-4 text-primary">
            Students – {{ teacher.subject }}
        </h4>

        <table class="table table-bordered text-center align-middle">
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.roll_no }}</td>
                    <td>{{ s.name }}</td>
                    <td>{{ s.course }}</td>
                    <td>{{ s.mobile }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">No students found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

<script src="{% static 'js/teacher.js' %}"></script>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reena Mehta College ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="login-container">

    <!-- LEFT SIDE -->

    <div class="left-panel">

        <div class="overlay"></div>

        <div class="college-info">

            <img src="{% static 'images/logo/college_logo.png' %}" class="college-logo">

            <h1>Reena Mehta College ERP</h1>

            <h5>Enterprise Resource Planning System</h5>

            <p>

                Student Management • Attendance • Marks • Assignment • Library • Placement

            </p>

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-panel">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p class="text-muted mb-4">
                Login to continue
            </p>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        Login As

                    </label>

                    <select class="form-select" name="role">

                        <option value="Admin">Administrator</option>

                        <option value="Teacher">Teacher</option>

                        <option value="Student">Student</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>User ID</label>

                    <input
                        type="text"
                        class="form-control"
                        name="user_id"
                        placeholder="Enter User ID"
                        required>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            required>

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword()">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#" class="text-decoration-none">

                        Forgot Password?

                    </a>

                </div>

                <button class="btn login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </form>

        </div>

    </div>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>

</html>
